[project]
name = "autosubs"
version = "0.1.0"
description = "Subtitulos traducidos en vivo para YouTube"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pjvegam" }]
keywords = ["subtitles", "translation", "whisper", "youtube", "asr", "yt-dlp"]
requires-python = ">=3.12"
dependencies = [
    "audioop-lts>=0.2.2; python_version >= '3.13'",
    "openai>=2.21.0",
    "pyaudiowpatch>=0.2.12.8",
    "python-dotenv>=1.2.1",
    "webrtcvad-wheels>=2.0.14",
    "yt-dlp>=2026.8.19",
]

[project.optional-dependencies]
diarize = ["nemo_toolkit[asr]>=2.0", "torch>=2.0", "torchaudio>=2.0"]
local-whisper = ["faster-whisper>=1.1.0", "nvidia-cublas-cu12>=12.4"]
gemini = ["google-genai>=1.0"]
cohere-asr = ["transformers>=4.46", "librosa>=0.10", "accelerate>=0.30"]
tedx = ["jaconv>=0.4"]

[project.scripts]
autosubs = "autosubs.main:main"

[project.urls]
Homepage = "https://github.com/pjvegam/autosubs"
Repository = "https://github.com/pjvegam/autosubs"
Issues = "https://github.com/pjvegam/autosubs/issues"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jaconv>=0.4",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "S",     # flake8-bandit (seguridad)
    "RUF",   # ruff-specific
]
ignore = [
    "S603",    # subprocess sin shell=True es seguro
    "S607",    # paths parciales en subprocess (yt-dlp, ffmpeg, mpv son CLI tools)
    "ASYNC110", # polling con sleep es intencional para monitorear procesos externos
    "ASYNC230", # open() bloqueante en async es aceptable para archivos locales pequeños
    "ASYNC240", # Path methods bloqueantes en async es aceptable (operaciones triviales)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]  # assert en tests + /tmp en paths de test son seguros
"scripts/*" = ["E402"]        # los scripts hacen sys.path.insert antes de importar autosubs
# Texto japones: los caracteres zenkaku son el dato, no una confusion tipografica
"src/autosubs/tedx.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_tedx.py" = ["S101", "S108", "RUF001", "RUF002", "RUF003"]
